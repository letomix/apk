<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des heures et déplacements</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h2 {
      text-align: center;
      color: #1a1a1a;
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .col {
      flex: 1;
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #f8f9fa;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #2563eb;
      background-color: #fff;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #4b5563;
      margin-bottom: 4px;
      font-weight: 500;
    }

    /* Estilos dos Botões */
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:disabled {
      background-color: #d1d5db !important;
      color: #9ca3af !important;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-charger {
      background-color: #475569;
      color: white;
      width: 100%;
    }

    .btn-ajouter {
      background-color: #2563eb;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .btn-save {
      background-color: #16a34a;
      color: white;
      flex: 1;
    }

    .btn-token {
      background-color: #475569;
      color: white;
      flex: 1;
    }

    /* Painéis de Notificação */
    .status-banner {
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.success {
      background-color: #dcfce7;
      color: #15803d;
    }

    .status-banner.error {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .status-banner.info {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    /* Caixa de Totalização */
    .total-box {
      background-color: #eff6ff;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      color: #1e40af;
      font-weight: bold;
    }

    /* Tabela */
    .table-container {
      overflow-x: auto;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      padding: 8px;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 500;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid #f3f4f6;
      color: #1f2937;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
    }

    .form-section {
      background-color: #f9fafb;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #f3f4f6;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Suivi des heures et déplacements</h2>

  <!-- Seleção de Mês e Ano -->
  <div class="row">
    <div class="col" style="flex: 0.8;">
      <select id="selectAno">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
    </div>
    <div class="col" style="flex: 1.5;">
      <select id="selectMes">
        <option value="01">01 - Janvier</option>
        <option value="02">02 - Février</option>
        <option value="03">03 - Mars</option>
        <option value="04">04 - Avril</option>
        <option value="05">05 - Mai</option>
        <option value="06">06 - Juin</option>
        <option value="07">07 - Juillet</option>
        <option value="08">08 - Août</option>
        <option value="09" selected>09 - Septembre</option>
        <option value="10">10 - Octobre</option>
        <option value="11">11 - Novembre</option>
        <option value="12">12 - Décembre</option>
      </select>
    </div>
    <div class="col" style="flex: 1;">
      <button type="button" class="btn-charger" id="btnCharger">🔍 Charger</button>
    </div>
  </div>

  <!-- Banner de Notificação -->
  <div id="statusMessage" class="status-banner"></div>

  <!-- Formulário de Entrada de Dados -->
  <div class="form-section">
    <div class="row">
      <div class="col">
        <label for="inputDate">Date (dados)</label>
        <input type="date" id="inputDate">
      </div>
      <div class="col">
        <label for="inputLieu">Lieu / Client (local)</label>
        <input type="text" id="inputLieu" placeholder="Ex: quimper">
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label for="inputHeures">Heures (horas)</label>
        <input type="time" id="inputHeures">
      </div>
      <div class="col" style="display: flex; align-items: flex-end;">
        <button type="button" class="btn-ajouter" id="btnAjouter" disabled>+ Ajouter</button>
      </div>
    </div>
  </div>

  <!-- Exibição do Total de Horas -->
  <div class="total-box">
    <span>Total des Heures:</span>
    <span id="totalHeures">00:00h</span>
  </div>

  <!-- Tabela de Registos -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Lieu</th>
          <th>Heures</th>
          <th style="text-align: center;">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="4" style="text-align: center; color: #9ca3af; padding: 15px;">
            Aucun enregistrement pour ce mois.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botões de Ação com GitHub -->
  <div class="row">
    <button type="button" class="btn-save" id="btnSaveGithub" disabled>☁️ Enregistrer sur GitHub</button>
    <button type="button" class="btn-token" id="btnTokenGithub">⚙️ Token GitHub</button>
  </div>
</div>

<script>
  /**
   * Módulo de Gestão de Registos e Sincronização GitHub
   */
  let registosMes = [];
  let githubToken = localStorage.getItem('github_token') || '';
  const REPO_OWNER = 'letomix';
  const REPO_NAME = 'letomix.github.io';

  // Referências DOM
  const selectAno = document.getElementById('selectAno');
  const selectMes = document.getElementById('selectMes');
  const btnCharger = document.getElementById('btnCharger');
  const statusMessage = document.getElementById('statusMessage');
  const inputDate = document.getElementById('inputDate');
  const inputLieu = document.getElementById('inputLieu');
  const inputHeures = document.getElementById('inputHeures');
  const btnAjouter = document.getElementById('btnAjouter');
  const tableBody = document.getElementById('tableBody');
  const totalHeuresDisplay = document.getElementById('totalHeures');
  const btnSaveGithub = document.getElementById('btnSaveGithub');
  const btnTokenGithub = document.getElementById('btnTokenGithub');

  // Inicializa o campo com a data atual
  inputDate.valueAsDate = new Date();

  // --- VALIDAÇÕES DE INTERFACE ---
  function validarFormulario() {
    const lieuValido = inputLieu.value.trim() !== '';
    const heuresValidas = inputHeures.value.trim() !== '';
    const dateValida = inputDate.value.trim() !== '';

    // O botão de adicionar só ativa com todos os campos preenchidos
    btnAjouter.disabled = !(lieuValido && heuresValidas && dateValida);
  }

  function validarGravação() {
    // Impede o envio de dados caso a lista esteja vazia
    btnSaveGithub.disabled = registosMes.length === 0;
  }

  inputLieu.addEventListener('input', validarFormulario);
  inputHeures.addEventListener('input', validarFormulario);
  inputDate.addEventListener('input', validarFormulario);

  // --- UTILITÁRIOS ---
  function formatarData(dataISO) {
    if (!dataISO) return '';
    const partes = dataISO.split('-');
    if (partes.length !== 3) return dataISO;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  function parseTimeToMinutes(timeStr) {
    if (!timeStr || typeof timeStr !== 'string' || !timeStr.includes(':')) return 0;
    const [h, m] = timeStr.split(':').map(Number);
    return (h * 60) + (m || 0);
  }

  function formatMinutesToHours(totalMinutes) {
    const h = Math.floor(totalMinutes / 60);
    const m = totalMinutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}h`;
  }

  function exibirStatus(mensagem, tipo) {
    statusMessage.textContent = mensagem;
    statusMessage.className = `status-banner show ${tipo}`;
  }

  // --- LEITURA E PROCESSAMENTO DO JSON ---
  async function carregarDados() {
    const ano = selectAno.value;
    const mes = selectMes.value;
    const filePath = `${ano}/${mes}.json`;
    const url = `${filePath}?v=${new Date().getTime()}`;

    try {
      exibirStatus(`A carregar dados de ${filePath}...`, 'info');
      const response = await fetch(url, { cache: 'no-store' });

      if (!response.ok) {
        if (response.status === 404) {
          throw new Error(`Ficheiro ${filePath} ainda não existe no repositório.`);
        }
        throw new Error(`Erro ao ler ficheiro (${response.status})`);
      }

      const data = await response.json();
      if (!Array.isArray(data)) {
        throw new Error("Estrutura do ficheiro JSON em formato inválido.");
      }

      registosMes = data;
      renderizarTabela();
      exibirStatus(`Données chargées depuis ${filePath}`, 'success');

    } catch (error) {
      console.warn(error);
      registosMes = [];
      renderizarTabela();
      exibirStatus(error.message, 'error');
    }
  }

  // --- RENDERIZAÇÃO RESISTENTE A NORMAS DIVERGENTES DE CHAVES ---
  function renderizarTabela() {
    tableBody.innerHTML = '';
    let totalMinutos = 0;

    if (!Array.isArray(registosMes) || registosMes.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="4" style="text-align: center; color: #9ca3af; padding: 15px;">
            Aucun enregistrement pour ce mois.
          </td>
        </tr>
      `;
      totalHeuresDisplay.textContent = '00:00h';
      validarGravação();
      return;
    }

    registosMes.forEach((item, index) => {
      // Mapeamento dinâmico para evitar 'undefined'
      const valData = item.date || item.Date || item.data || '-';
      const valLieu = item.lieu || item.Lieu || item.client || item.Client || item.local || '-';
      const valHeures = item.heures || item.Heures || item.horas || item.Horas || '00:00';

      totalMinutos += parseTimeToMinutes(valHeures);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${valData}</td>
        <td>${valLieu}</td>
        <td>${valHeures}</td>
        <td style="text-align: center;">
          <button type="button" class="btn-delete" onclick="removerRegisto(${index})">🗑️</button>
        </td>
      `;
      tableBody.appendChild(tr);
    });

    totalHeuresDisplay.textContent = formatMinutesToHours(totalMinutos);
    validarGravação();
  }

  // --- CONTROLO DE DADOS EM MEMÓRIA ---
  btnAjouter.addEventListener('click', () => {
    const novoRegisto = {
      date: formatarData(inputDate.value),
      lieu: inputLieu.value.trim(),
      heures: inputHeures.value
    };

    registosMes.push(novoRegisto);
    renderizarTabela();

    // Limpa os campos após adicionar
    inputLieu.value = '';
    inputHeures.value = '';
    validarFormulario();
  });

  function removerRegisto(index) {
    registosMes.splice(index, 1);
    renderizarTabela();
  }

  // --- GRAVAÇÃO NA API DO GITHUB ---
  btnSaveGithub.addEventListener('click', async () => {
    if (!githubToken) {
      alert("Configure o Token do GitHub antes de continuar.");
      return;
    }

    if (registosMes.length === 0) {
      alert("Operação cancelada: Não é possível gravar uma lista sem registos.");
      return;
    }

    const ano = selectAno.value;
    const mes = selectMes.value;
    const path = `${ano}/${mes}.json`;
    const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;

    try {
      exibirStatus("A guardar dados no GitHub...", "info");

      // Obter o SHA do ficheiro existente para permitir a atualização
      let sha = "";
      const getRes = await fetch(apiUrl, {
        headers: { "Authorization": `token ${githubToken}` }
      });
      
      if (getRes.ok) {
        const fileData = await getRes.json();
        sha = fileData.sha;
      }

      // Preparação e codificação UTF-8 -> Base64
      const jsonContent = JSON.stringify(registosMes, null, 2);
      const contentEncoded = btoa(unescape(encodeURIComponent(jsonContent)));

      const payload = {
        message: `Mise à jour des heures: ${mes}/${ano}`,
        content: contentEncoded,
        sha: sha !== "" ? sha : undefined
      };

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${githubToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (putRes.ok) {
        exibirStatus("Données enregistrées avec succès sur GitHub!", "success");
      } else {
        throw new Error(`Erro na gravação GitHub (${putRes.status})`);
      }

    } catch (err) {
      console.error(err);
      exibirStatus(err.message, "error");
    }
  });

  // --- GESTÃO DO TOKEN ---
  btnTokenGithub.addEventListener('click', () => {
    const input = prompt("Insira o seu Personal Access Token do GitHub:", githubToken);
    if (input !== null) {
      githubToken = input.trim();
      localStorage.setItem('github_token', githubToken);
      alert("Token guardado localmente com sucesso.");
    }
  });

  btnCharger.addEventListener('click', carregarDados);

  // Carregamento automático na abertura
  carregarDados();
</script>
</body>
</html>
