<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo de Horas e Locais</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text);
        }

        .month-select-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, input, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.danger {
            background-color: var(--danger);
        }

        button.danger:hover {
            background-color: #dc2626;
        }

        button.secondary {
            background-color: #64748b;
        }

        button.secondary:hover {
            background-color: #475569;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 16px;
            border-top: 2px solid var(--border);
        }

        .total-badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.05rem;
        }

        .file-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #fileInput {
            display: none;
        }

        .status-msg {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .status-msg.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .status-msg.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Registo de Horas</h1>
        <div class="month-select-container">
            <label for="monthSelect"><strong>Mês:</strong></label>
            <select id="monthSelect" onchange="carregarDoGithub()">
                <option value="01">01 - Janeiro</option>
                <option value="02">02 - Fevereiro</option>
                <option value="03">03 - Março</option>
                <option value="04">04 - Abril</option>
                <option value="05">05 - Maio</option>
                <option value="06">06 - Junho</option>
                <option value="07">07 - Julho</option>
                <option value="08" selected>08 - Agosto</option>
                <option value="09">09 - Setembro</option>
                <option value="10">10 - Outubro</option>
                <option value="11">11 - Novembro</option>
                <option value="12">12 - Dezembro</option>
            </select>
        </div>
    </header>

    <div id="status" class="status-msg"></div>

    <!-- Form para Adicionar -->
    <form id="addForm" onsubmit="adicionarRegisto(event)" class="form-grid">
        <div class="form-group">
            <label for="inputData">Data (dados)</label>
            <input type="date" id="inputData" required>
        </div>
        <div class="form-group">
            <label for="inputLocal">Local (local)</label>
            <input type="text" id="inputLocal" placeholder="Ex: quimper" required>
        </div>
        <div class="form-group">
            <label for="inputHoras">Horas (horas)</label>
            <input type="time" id="inputHoras" required>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button type="submit">+ Adicionar</button>
        </div>
    </form>

    <!-- Tabela -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data (dados)</th>
                    <th>Local (local)</th>
                    <th>Horas (horas)</th>
                    <th style="width: 80px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <tr><td colspan="4" style="text-align:center;">A carregar dados...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Barra Inferior -->
    <div class="actions-bar">
        <div class="total-badge" id="totalBadge">Total: 00:00</div>
        
        <div class="file-controls">
            <button type="button" class="secondary" onclick="document.getElementById('fileInput').click()">
                📂 Abrir Ficheiro JSON
            </button>
            <input type="file" id="fileInput" accept=".json" onchange="carregarFicheiroManual(event)">
            
            <button type="button" onclick="guardarJson()">
                💾 Guardar Ficheiro JSON
            </button>
        </div>
    </div>
</div>

<script>
    let registos = [];

    // Define data padrão de hoje no input
    document.getElementById('inputData').valueAsDate = new Date();

    // Carregar ficheiro JSON automaticamente do repositório (ex: 08.json)
    async function carregarDoGithub() {
        const mes = document.getElementById('monthSelect').value;
        const ficheiro = `${mes}.json`;
        mostrarStatus(`A tentar carregar ${ficheiro}...`, 'info');

        try {
            const resposta = await fetch(ficheiro, { cache: "no-store" });
            if (!resposta.ok) {
                throw new Error(`Ficheiro ${ficheiro} não encontrado no repositório.`);
            }
            registos = await resposta.json();
            renderizarTabela();
            mostrarStatus(`Ficheiro ${ficheiro} carregado com sucesso!`, 'success');
        } catch (erro) {
            registos = [];
            renderizarTabela();
            mostrarStatus(`Aviso: ${erro.message} (Pode adicionar novos dados e guardar).`, 'error');
        }
    }

    function renderizarTabela() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';

        if (registos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum registo encontrado.</td></tr>';
            document.getElementById('totalBadge').innerText = 'Total: 00:00';
            return;
        }

        let totalMinutos = 0;

        registos.forEach((item, index) => {
            // Somar minutos
            if (item.horas) {
                const [h, m] = item.horas.split(':').map(Number);
                totalMinutos += (h || 0) * 60 + (m || 0);
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.dados || ''}</strong></td>
                <td>${item.local || ''}</td>
                <td>${item.horas || ''}</td>
                <td style="text-align: center;">
                    <button class="danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="eliminarRegisto(${index})">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Atualizar Total
        const horasTotais = Math.floor(totalMinutos / 60);
        const minsTotais = totalMinutos % 60;
        const totalFormatado = `${String(horasTotais).padStart(2, '0')}:${String(minsTotais).padStart(2, '0')}`;
        document.getElementById('totalBadge').innerText = `Total: ${totalFormatado}h`;
    }

    function adicionarRegisto(e) {
        e.preventDefault();
        const dados = document.getElementById('inputData').value;
        const local = document.getElementById('inputLocal').value;
        const horas = document.getElementById('inputHoras').value;

        registos.push({ dados, local, horas });
        renderizarTabela();

        // Limpar apenas local e horas
        document.getElementById('inputLocal').value = '';
        document.getElementById('inputHoras').value = '';
        mostrarStatus('Registo adicionado à lista. Lembre-se de clicar em "Guardar Ficheiro JSON".', 'success');
    }

    function eliminarRegisto(index) {
        registos.splice(index, 1);
        renderizarTabela();
    }

    function guardarJson() {
        const mes = document.getElementById('monthSelect').value;
        const nomeFicheiro = `${mes}.json`;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registos, null, 2));
        
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", nomeFicheiro);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        mostrarStatus(`Ficheiro ${nomeFicheiro} descarregado! Suba-o para a raiz do seu GitHub para atualizar online.`, 'success');
    }

    function carregarFicheiroManual(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                registos = JSON.parse(e.target.result);
                renderizarTabela();
                mostrarStatus(`Ficheiro ${file.name} carregado com sucesso!`, 'success');
            } catch (err) {
                mostrarStatus('Erro ao ler o ficheiro JSON. Verifique o formato.', 'error');
            }
        };
        reader.readAsText(file);
    }

    function mostrarStatus(mensagem, tipo) {
        const el = document.getElementById('status');
        el.innerText = mensagem;
        el.className = `status-msg ${tipo}`;
        setTimeout(() => {
            if (el.innerText === mensagem) el.style.display = 'none';
        }, 5000);
    }

    // Carregar automaticamente ao abrir a página
    window.onload = carregarDoGithub;
</script>

</body>
</html>
